# Data Ingestion parameters
data_ingestion:
  source_data_url: "https://raw.githubusercontent.com/Aniket-Muthal/datasets/refs/heads/main/ExtraaLearn.csv"
  raw_data_path: "data/raw/raw_data.csv"

# Data Validation parameters
data_validation:
  # Raw data validation
  raw_data_path: "data/raw/raw_data.csv"
  raw_val_report_path: "artifacts/data_validation/raw/validation_report.json"
  raw_val_status_path: "artifacts/data_validation/raw/validation_status.txt"

  # Cleaned data validation
  cleaned_train_path: "data/cleaned/cleaned_train.csv"
  cleaned_val_report_path: "artifacts/data_validation/cleaned/validation_report.json"
  cleaned_val_status_path: "artifacts/data_validation/cleaned/validation_status.txt"

  # Processed (Imputed) data validation
  # imputed_train_path: "data/processed/imputed_train.csv"
  # processed_val_report_path: "artifacts/data_validation/processed/validation_report.json"
  # processed_val_status_path: "artifacts/data_validation/processed/validation_status.txt"

# Raw Data Validation
raw_data_validation:
  schema:
    target_feature:
      status: int64

    features:
      ID: object
      age: int64
      current_occupation: object
      first_interaction: object
      profile_completed: object
      website_visits: int64
      time_spent_on_website: int64
      page_views_per_visit: float64
      last_activity: object
      print_media_type1: object
      print_media_type2: object
      digital_media: object
      educational_channels: object
      referral: object

  valid_values:
    current_occupation:
      - 'Unemployed'
      - 'Professional'
      - 'Student'
    first_interaction:
      - 'Website'
      - 'Mobile App'
    profile_completed:
      - 'High'
      - 'Medium'
      - 'Low'
    last_activity:
      - 'Website Activity'
      - 'Email Activity'
      - 'Phone Activity'
    print_media_type1:
      - 'Yes'
      - 'No'
    print_media_type2:
      - 'Yes'
      - 'No'
    digital_media:
      - 'Yes'
      - 'No'
    educational_channels:
      - 'Yes'
      - 'No'
    referral:
      - 'Yes'
      - 'No'

data_cleaning_split:
  raw_data_path: "data/raw/raw_data.csv"
  raw_val_status_path: "artifacts/data_validation/raw/validation_status.txt"
  cleaned_train_path: "data/cleaned/cleaned_train.csv"
  cleaned_test_path: "data/cleaned/cleaned_test.csv"
  random_state: 28
  test_size: 0.2
  stratify_column: "status"

cleaned_data_validation:
  schema:
    target_feature:
      status: int64
  
    features:
      id: object
      age: int64
      occupation: object
      first_interaction: object
      profile_completion_level: object
      website_visits: int64
      web_time: int64
      page_views_per_visit: float64
      last_interaction: object
      newspaper_ad_exposure: object
      magazine_ad_exposure: object
      digital_ad_exposure: object
      educational_forum_exposure: object
      via_referral: object

  valid_values:
      occupation:
        - 'unemployed'
        - 'professional'
        - 'student'
      first_interaction:
        - 'website'
        - 'mobile app'
      profile_completion_level:
        - 'high'
        - 'medium'
        - 'low'
      last_interaction:
        - 'website activity'
        - 'email activity'
        - 'phone activity'
      newspaper_ad_exposure:
        - 'yes'
        - 'no'
      magazine_ad_exposure:
        - 'yes'
        - 'no'
      digital_ad_exposure:
        - 'yes'
        - 'no'
      educational_forum_exposure:
        - 'yes'
        - 'no'
      via_referral:
        - 'yes'
        - 'no'

data_transformation:
  cleaned_val_status_path: "artifacts/data_validation/cleaned/validation_status.txt"
  cleaned_train_path: "data/cleaned/cleaned_train.csv"
  cleaned_test_path: "data/cleaned/cleaned_test.csv"
  processed_train_path: "data/processed/processed_train.csv"
  processed_test_path: "data/processed/processed_test.csv"
  transformed_train_path: "data/transformed/transformed_train.csv"
  transformed_test_path: "data/transformed/transformed_test.csv"
  preprocessor_path: "artifacts/transformers/feature_preprocessor.joblib"

  target_column: status
  columns_to_drop: id

  numerical_imputation_strategy: median
  categorical_imputation_strategy: most_frequent

  one_hot_encoder:
    sparse_output: false
    handle_unknown: ignore
    drop: first

  numerical_features:
    - age
    - website_visits
    - web_time
    - page_views_per_visit
  
  categorical_features:
    - occupation
    - first_interaction
    - profile_completion_level
    - last_interaction
    - newspaper_ad_exposure
    - magazine_ad_exposure
    - digital_ad_exposure
    - educational_forum_exposure
    - via_referral
