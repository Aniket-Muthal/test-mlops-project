      size: 7621
    params:
      params.yaml:
        data_transformation.categorical_features:
        - occupation
        - first_interaction
        - profile_completion_level
        - last_interaction
        - newspaper_ad_exposure
        - magazine_ad_exposure
        - digital_ad_exposure
        - educational_forum_exposure
        - via_referral
        data_transformation.categorical_imputation_strategy: most_frequent
        data_transformation.columns_to_drop: id
        data_transformation.numerical_features:
        - age
        - website_visits
        - web_time
        - page_views_per_visit
        data_transformation.numerical_imputation_strategy: median
        data_transformation.one_hot_encoder.drop: first
        data_transformation.one_hot_encoder.handle_unknown: ignore
        data_transformation.one_hot_encoder.sparse_output: false
        data_transformation.target_column: status
