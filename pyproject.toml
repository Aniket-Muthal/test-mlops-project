
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scoring-mlops-pipeline"
version = "0.1.0"
description = "An end-to-end lead scoring ML pipeline with data validation, reproducibility, and experiment tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "PyYAML",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
