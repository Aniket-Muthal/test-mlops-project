stages:
  data_ingestion:
    cmd: python -m lead_scoring.runners.ingestion_runner
    deps:
    - src/lead_scoring/config/entity_config.py
    - src/lead_scoring/config/configuration.py
    - src/lead_scoring/components/data_ingestion.py
    - src/lead_scoring/runners/ingestion_runner.py
    params:
    - data_ingestion.raw_data_path
    - data_ingestion.source_data_url
    outs:
    - data/raw/raw_data.csv

  raw_data_validation:
    cmd: python -m lead_scoring.runners.validation_runner --mode raw
    deps:
    - data/raw/raw_data.csv
    - src/lead_scoring/config/entity_config.py
    - src/lead_scoring/config/configuration.py
    - src/lead_scoring/components/data_validation.py
    - src/lead_scoring/runners/validation_runner.py
    params:
    - raw_data_validation.schema
    - raw_data_validation.valid_values
    outs:
    - artifacts/data_validation/raw/validation_report.json
    - artifacts/data_validation/raw/validation_status.txt

  data_cleaning:
    cmd: python -m lead_scoring.runners.cleaning_runner
    deps:
    - data/raw/raw_data.csv
    - artifacts/data_validation/raw/validation_status.txt
    - src/lead_scoring/config/entity_config.py
    - src/lead_scoring/config/configuration.py
    - src/lead_scoring/components/data_cleaning.py
    - src/lead_scoring/runners/cleaning_runner.py
    - src/lead_scoring/transformers/feature_cleaner.py
    params:
    - data_cleaning_split.random_state
    - data_cleaning_split.test_size
    outs:
    - data/cleaned/cleaned_train.csv
    - data/cleaned/cleaned_test.csv

  cleaned_data_validation:
    cmd: python -m lead_scoring.runners.validation_runner --mode cleaned
    deps:
    - data/cleaned/cleaned_train.csv
    - src/lead_scoring/config/entity_config.py
    - src/lead_scoring/config/configuration.py
    - src/lead_scoring/components/data_validation.py
    - src/lead_scoring/runners/validation_runner.py
    params:
    - cleaned_data_validation.schema
    - cleaned_data_validation.valid_values
    outs:
    - artifacts/data_validation/cleaned/validation_report.json
    - artifacts/data_validation/cleaned/validation_status.txt

  data_transformation:
    cmd: python -m lead_scoring.runners.transformation_runner
    deps:
    - data/cleaned/cleaned_train.csv
    - data/cleaned/cleaned_test.csv
    - artifacts/data_validation/cleaned/validation_status.txt
    - src/lead_scoring/config/entity_config.py
    - src/lead_scoring/config/configuration.py
    - src/lead_scoring/transformers/feature_preprocessor.py
    - src/lead_scoring/components/data_transformation.py
    - src/lead_scoring/runners/transformation_runner.py
    params:
    - data_transformation.target_column
    - data_transformation.columns_to_drop
    - data_transformation.numerical_imputation_strategy
    - data_transformation.categorical_imputation_strategy
    - data_transformation.one_hot_encoder.sparse_output
    - data_transformation.one_hot_encoder.handle_unknown
    - data_transformation.one_hot_encoder.drop
    - data_transformation.numerical_features
    - data_transformation.categorical_features
    outs:
    - data/processed/processed_train.csv
    - data/processed/processed_test.csv
    - data/transformed/transformed_train.csv
    - data/transformed/transformed_test.csv
    - artifacts/transformers/feature_preprocessor.joblib
